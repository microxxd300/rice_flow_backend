version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Stay on Django 5.2 LTS
      - dependency-name: django
        versions: ['>=6']
      # pandas 3 needs a check of the ML code and training notebook first
      - dependency-name: pandas
        versions: ['>=3']

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      # Stay on Python 3.13 until the pinned numpy and scikit-learn wheels support newer versions
      - dependency-name: python
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
