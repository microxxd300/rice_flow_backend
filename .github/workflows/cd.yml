name: CD

# Runs after CI passes on a push to main (a merged PR)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    name: Build, push, deploy, health check
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ env.SHA }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.SHA }}

      # Until hosting is set up, the image is still built and pushed; only the deploy is skipped
      - name: Deploy to Render
        id: deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL secret is not set. Image pushed to GHCR; deploy skipped."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=$(printf '%s' "$IMAGE:$SHA" | jq -sRr @uri)" > /dev/null
          echo "Deploy triggered for $IMAGE:$SHA"

      - name: Wait for /api/health/ to report the new version
        if: steps.deploy.outputs.skipped != 'true'
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error::PRODUCTION_URL variable is not set"; exit 1
          fi
          for i in $(seq 1 40); do
            body=$(curl -fsS "$PRODUCTION_URL/api/health/" || true)
            echo "Attempt $i: $body"
            if echo "$body" | grep -q "\"version\":\"$SHA\""; then
              echo "New release is live and healthy"; exit 0
            fi
            sleep 15
          done
          echo "::error::Health check did not report version $SHA within 10 minutes"; exit 1
