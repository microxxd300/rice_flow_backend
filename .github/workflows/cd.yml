name: CD

# Runs after CI passes on a push to main (a merged PR)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    name: Build, push, deploy, health check
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ env.SHA }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.SHA }}

      # Until the VM's secrets are set, the image is still built and pushed; only the deploy is skipped
      - name: Check the Azure VM is configured
        id: deploy
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
        run: |
          if [ -z "$AZURE_VM_HOST" ]; then
            echo "::notice::AZURE_VM_HOST secret is not set. Image pushed to GHCR; deploy skipped."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          fi

      # The VM pulls the new image and restarts the backend (deploy/docker-compose.prod.yml)
      - name: Deploy to the Azure VM
        if: steps.deploy.outputs.skipped != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            cd /opt/riceflow
            docker compose -f docker-compose.prod.yml pull backend
            docker compose -f docker-compose.prod.yml up -d backend
            docker image prune -f

      - name: Wait for /api/health/ to report the new version
        if: steps.deploy.outputs.skipped != 'true'
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error::PRODUCTION_URL variable is not set"; exit 1
          fi
          for i in $(seq 1 40); do
            body=$(curl -fsS "$PRODUCTION_URL/api/health/" || true)
            echo "Attempt $i: $body"
            if echo "$body" | grep -q "\"version\":\"$SHA\""; then
              echo "New release is live and healthy"; exit 0
            fi
            sleep 15
          done
          echo "::error::Health check did not report version $SHA within 10 minutes"; exit 1
