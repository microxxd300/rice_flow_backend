name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrations, tests, deploy check)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: riceflow
          POSTGRES_PASSWORD: riceflow
          POSTGRES_DB: riceflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U riceflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://riceflow:riceflow@localhost:5432/riceflow
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-${{ github.run_id }}-${{ github.sha }}
      DEBUG: 'True'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: coverage run manage.py test

      - name: Coverage report
        run: |
          coverage report
          coverage xml
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

      - name: Django deploy check
        env:
          DEBUG: 'False'
          ALLOWED_HOSTS: riceflow.example.com
        run: python manage.py check --deploy --fail-level WARNING

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: GIT_SHA=${{ github.sha }}

  dependency-audit:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install pip-audit==2.7.3
      - run: pip-audit -r requirements.txt

  secret-scan:
    name: Security (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
